onboarding = false
[theme]
# tmux/nvimと合わせてtokyo-nightに統一
name = "tokyo-night"

[ui]
agent_panel_sort = "spaces"

[keys]
# tmux (config/tmux/tmux.conf) の prefix "C-Space" に合わせる
prefix = "ctrl+space"

# bind C-n new-session
new_workspace = "prefix+ctrl+n"
# bind r source-file ...（config再読込）
reload_config = "prefix+r"
# reload_configをprefix+rに寄せたためデフォルト(prefix+r)から退避
resize_mode = "prefix+shift+r"
# bind | / bind \\ split-window -h（左右分割）
split_vertical = "prefix+|"
# bind - split-window -v（上下分割）
split_horizontal = "prefix+minus"
# bind C-w kill-window
close_tab = "prefix+ctrl+w"
# bind -r n next-window
next_tab = "prefix+n"
# bind -r p previous-window
previous_tab = "prefix+p"
# bind -r h/j/k/l select-pane
focus_pane_left = "prefix+h"
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"

# bind g popup lazygit（デフォルトのgoto=prefix+gと衝突するためalt+gに）
[[keys.command]]
key = "prefix+alt+g"
type = "popup"
command = "lazygit"
width = "90%"
height = "90%"

# bind d popup lazydocker
[[keys.command]]
key = "prefix+d"
type = "popup"
command = "lazydocker"
width = "90%"
height = "90%"

# zshのC-g（ghqリポジトリ選択）と同じ体験をworkspace切り替えとして提供
[[keys.command]]
key = "ctrl+g"
type = "popup"
command = "herdr-ghq-workspace"
width = "90%"
height = "90%"

# usageプラグイン: Claude Code/Codexの利用状況ダッシュボードを開く
# (デフォルト・既存のキーバインドにprefix+uは使われていないため採用)
# herdr plugin pane open はサーバー側でプラグインのpane定義(placement=popup, 70%x70%)を
# そのまま使って開いてくれるため、type="shell"でCLI呼び出しするだけで済む
[[keys.command]]
key = "prefix+u"
type = "shell"
command = "herdr plugin pane open --plugin usage --entrypoint dashboard"

# herdr-file-viewerプラグイン: git対応の読み取り専用ファイルビューアをsplitで開く
# (README推奨バインド。既存のprefix+f/prefix+shift+fは未使用のため採用)
[[keys.command]]
key = "prefix+f"
type = "shell"
command = "herdr plugin action invoke open-file-viewer --plugin herdr-file-viewer"

# 同ビューアを専用tabで開く版 (README推奨バインド)
[[keys.command]]
key = "prefix+shift+f"
type = "shell"
command = "herdr plugin action invoke open-file-viewer-tab --plugin herdr-file-viewer"

# デフォルトの spaces 行構成 (state_icon/workspace, branch/git_status) を維持しつつ、
# usageプラグインがreport-metadataで報告するトークンをそれぞれ専用行に追加。
# 横並び3連バーは読みにくいというフィードバックを受け、1行1トークンに分割。
# トークン単位スタイル({ token = "...", fg = "..." }) はherdr 0.7.5で追加された
# 記法（src/config/sidebar.rs のRawStyledSidebarToken）。fgはtokyo-nightの
# blue #7aa2f7 (Claude Code) / purple #bb9af7 (Codex) で系統を色分けする。
[ui.sidebar.spaces]
rows = [
  ["state_icon", "workspace"],
  ["branch", "git_status"],
  [{ token = "$cc_5h", fg = "#7aa2f7" }],
  [{ token = "$cc_7d", fg = "#7aa2f7" }],
  [{ token = "$cx_rl", fg = "#bb9af7" }],
]
